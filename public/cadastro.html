<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/cadastro.css" />
  <link rel="icon" type="image/svg+xml" href="assets/img/Logo.jpg">
  <link rel="preconnect" href="https://fonts.gstatic.com" />

  <title>Cadastro</title>

  <script src="./js/sessao.js"></script>

</head>

<body onload="listar()">
  <!--header inicio-->
  <header class="header">
    <div class="logo_container">
      <img src="assets/img/Logo.jpg" alt="Solare Dance">
      <h2 class="logo">Solare <span class="logo"> Dance</span></h2>
    </div>

    <nav class="nav">
      <ul>
        <li><a href="../public/home/home.html">Home</a></li>
        <li><a href="#">Sobre Mim</a></li>

        <div class="btn-cadastro">
          <li><a href="../public/cadastro.html">Cadastro</a></li>
        </div>

        <div class="btn-login">
          <li><a href="#">Login</a></li>
        </div>

      </ul>

    </nav>
  </header>
  <!--header fim-->

  <div class="login">

    <div class="alerta_erro">

      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>

    </div>

    <div class="container">

      <div class="card-cadastro">
        <h2>Bem-vindo!</h2>

        <div class="formulario">

          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
          </div>

          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
          </div>

          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
          </div>

          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>

          <button class="botao" onclick="cadastrar()">Cadastrar</button>

          <div class="link_login">
            <p>Já possui conta? </p>
            <a href="#"> Clique aqui</a>
          </div>
        <div id="div_erros_login"></div>

      </div>
    </div>
  </div>

  <!--footer inicio-->
  <!-- <div class="footer">
    <div class="container">
      <h4>Feito com amor por aluno &hearts; SPTech &copy; 2023-2026</h4>
    </div>
  </div> -->
  <!--footer fim-->
</body>

</html>

<script>

  
  function cadastrar() {
    
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value


    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }


    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  // Listando empresas cadastradas 
  function listar() {
    fetch("/empresas/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaEmpresasCadastradas.push(empresa);

            console.log("listaEmpresasCadastradas")
            console.log(listaEmpresasCadastradas[0].codigo_ativacao)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
